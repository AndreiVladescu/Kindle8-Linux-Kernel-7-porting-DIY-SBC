<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <title>Kindle 8 eMMC layout after conversion (not to scale)</title>
  <style>
    .box  { fill: none; stroke: #8a939e; stroke-width: 1.2; }
    .used { fill: #8a939e; fill-opacity: .16; stroke: #8a939e; stroke-width: 1.2; }
    .keep { fill: #8a939e; fill-opacity: .05; stroke: #8a939e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .t    { fill: #8a939e; }
    .h    { fill: #8a939e; font-weight: bold; }
    .s    { fill: #8a939e; font-size: 10.5px; }
  </style>

  <!-- boot0 -->
  <text class="h" x="10" y="22">eMMC boot0 (4 MiB)</text>
  <rect class="keep" x="10" y="32" width="200" height="40"/>
  <text class="t" x="20" y="56">U-Boot 2014.04 @ 0x400</text>
  <text class="s" x="220" y="56">unchanged — never written</text>

  <!-- raw area -->
  <text class="h" x="10" y="102">user area, raw (512 B sectors)</text>
  <rect class="keep" x="10"  y="112" width="70"  height="56"/>
  <text class="s" x="16" y="134">MBR +</text><text class="s" x="16" y="148">0x0–0x207</text>

  <rect class="used" x="80"  y="112" width="170" height="56"/>
  <text class="t" x="88" y="132">normal slot</text>
  <text class="s" x="88" y="148">DTB 0x208 · zImage 0x2D0</text>
  <text class="s" x="88" y="162">mainline, autoboots</text>

  <rect class="used" x="250" y="112" width="170" height="56"/>
  <text class="t" x="258" y="132">diags slot</text>
  <text class="s" x="258" y="148">DTB 0x7208 · zImage 0x72D0</text>
  <text class="s" x="258" y="162">test kernels</text>

  <rect class="keep" x="420" y="112" width="90"  height="56"/>
  <text class="s" x="426" y="134">0xE208–</text><text class="s" x="426" y="148">unknown data</text><text class="s" x="426" y="162">not touched</text>

  <!-- partitions -->
  <text class="h" x="10" y="200">MBR partitions</text>
  <rect class="keep" x="10"  y="210" width="190" height="56"/>
  <text class="t" x="18" y="230">p1  450 MiB ext3</text>
  <text class="s" x="18" y="246">stock Amazon rootfs</text>
  <text class="s" x="18" y="260">kept as rescue userland</text>

  <rect class="used" x="200" y="210" width="150" height="56"/>
  <text class="t" x="208" y="230">p2  64 MiB raw</text>
  <text class="s" x="208" y="246">rescue slot @ 0xF1000</text>
  <text class="s" x="208" y="260">kernel w/o built-in args</text>

  <rect class="keep" x="350" y="210" width="130" height="56"/>
  <text class="t" x="358" y="230">p3  64 MiB ext3</text>
  <text class="s" x="358" y="246">stock /var/local</text>
  <text class="s" x="358" y="260">unchanged</text>

  <rect class="used" x="480" y="210" width="470" height="56"/>
  <text class="t" x="488" y="230">p4  3.0 GiB ext4 "alpine"</text>
  <text class="s" x="488" y="246">Alpine 3.24 root (was the FAT userstore)</text>
  <text class="s" x="488" y="260">root=/dev/mmcblk0p4, appended by the kernel's CONFIG_CMDLINE_EXTEND</text>

  <!-- legend -->
  <rect class="used" x="640" y="20" width="16" height="12"/><text class="s" x="662" y="30">written during this project</text>
  <rect class="keep" x="640" y="40" width="16" height="12"/><text class="s" x="662" y="50">left as shipped</text>
</svg>
